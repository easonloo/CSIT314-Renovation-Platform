{% extends 'base.html' %}
{% block title %}{{ action }} IDP{% endblock %}
{% block page_name %}{{ action }} Interior Design Project{% endblock %}
{% block content %}
<div class="page-head"><div><h1 class="page-title">{{ action }} Interior Design Project</h1><p class="page-subtitle">Add or update your project portfolio information.</p></div></div>
<form method="post" enctype="multipart/form-data" class="card">{% csrf_token %}<div class="form-grid"><div class="form-group"><label>Project title</label><input class="input" name="title" value="{{ project.title|default:'' }}" required></div><div class="form-group"><label>Status</label><select class="select" name="status"><option value="current" {% if project.status == 'current' %}selected{% endif %}>Current</option><option value="past" {% if project.status == 'past' %}selected{% endif %}>Past</option></select></div><div class="form-group"><label>Category</label><select class="select" name="category">{% for category in categories %}<option value="{{ category.id }}" {% if project.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></div><div class="form-group"><label>Location</label><input class="input" name="location" value="{{ project.location|default:'' }}"></div><div class="form-group"><label>Style</label><input class="input" name="style" value="{{ project.style|default:'' }}" placeholder="e.g. Modern, Scandinavian"></div><div class="form-group"><label>Project image</label><input class="input" type="file" name="image"></div><div class="form-group" style="grid-column:1/-1;"><label>Description</label><textarea class="textarea" name="description">{{ project.description|default:'' }}</textarea></div></div><div class="form-actions"><button class="btn btn-primary">Save project</button><a class="btn btn-light" href="{% url 'idp_list' %}">Cancel</a></div></form>
{% endblock %}
